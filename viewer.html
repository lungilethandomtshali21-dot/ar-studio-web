
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, viewport-fit=cover">

  <title>AR Studio | Live Camera</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    /* Let MindAR manage its own camera video */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100dvh !important;
      background: transparent !important;
    }

    /* Transparent WebGL layer */
    .a-canvas {
      background: transparent !important;
    }

    .header {
      position: fixed;
      z-index: 20;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      padding: 13px 16px;
      border-radius: 16px;
      background: rgba(244, 236, 255, 0.90);
      color: #584681;
      text-align: center;
      pointer-events: none;
    }

    .header strong {
      display: block;
      font-size: 17px;
    }

    .header span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
    }

    #status {
      position: fixed;
      z-index: 20;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(232, 243, 255, 0.94);
      color: #35476d;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <strong>AR Studio</strong>
    <span>Live Camera Augmented Reality</span>
  </div>

  <div id="status">
    Allow camera access, then scan the sample image.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
    "
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="trackedTarget"
      mindar-image-target="targetIndex: 0">

      <!-- Floating animated cube -->
      <a-box
        position="0 0.12 0.15"
        width="0.28"
        height="0.28"
        depth="0.28"
        color="#A78BFA"
        material="transparent: true; opacity: 0.9"
        animation="
          property: rotation;
          to: 0 360 0;
          dur: 3500;
          easing: linear;
          loop: true
        ">
      </a-box>

      <!-- Floating label -->
      <a-text
        value="AR STUDIO"
        color="#FFFFFF"
        align="center"
        position="0 0.4 0.1"
        width="1.6"
        side="double"
        animation="
          property: position;
          from: 0 0.35 0.1;
          to: 0 0.45 0.1;
          dur: 1400;
          dir: alternate;
          loop: true
        ">
      </a-text>

      <!-- Purple glowing sphere -->
      <a-sphere
        position="-0.35 -0.15 0.1"
        radius="0.09"
        color="#C4B5FD"
        animation="
          property: scale;
          from: 1 1 1;
          to: 1.3 1.3 1.3;
          dur: 900;
          dir: alternate;
          loop: true
        ">
      </a-sphere>

    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#trackedTarget");
    const status = document.querySelector("#status");

    scene.addEventListener("renderstart", () => {
      if (scene.renderer) {
        scene.renderer.setClearColor(0x000000, 0);
      }
    });

    target.addEventListener("targetFound", () => {
      status.textContent =
        "Image detected! Your AR animation is active.";
    });

    target.addEventListener("targetLost", () => {
      status.textContent =
        "Point your camera at the sample image.";
    });

    scene.addEventListener("arError", (event) => {
      status.textContent =
        "AR camera error. Check camera permissions.";
      console.error("MindAR error:", event);
    });
  </script>

</body>
</html>
