
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>AR Studio | AR Camera</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: #F8FBFF;
}

.header {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 1000;
  padding: 15px;
  border-radius: 14px;
  background: rgba(255,255,255,.92);
  color: #51447D;
  text-align: center;
  font-weight: bold;
  pointer-events: none;
}

.status {
  position: fixed;
  bottom: 20px;
  left: 5%;
  width: 90%;
  z-index: 1000;
  background: #DCCBFF;
  color: #302B50;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  box-sizing: border-box;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="header">
  ✦ AR Studio — Live AR Experience
</div>

<div id="status" class="status">
  Point your camera at the sample image.
</div>

<a-scene
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets></a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- Large visible AR background -->
    <a-plane
      position="0 0 0.01"
      width="0.9"
      height="0.9"
      material="color: #DCCBFF;
                opacity: 0.85;
                transparent: true;
                shader: flat;
                side: double">
    </a-plane>

    <!-- Rotating AR shape -->
    <a-plane
      position="0 0.12 0.04"
      width="0.38"
      height="0.38"
      material="color: #7455BB;
                shader: flat;
                side: double"
      animation="property: rotation;
                 from: 0 0 0;
                 to: 0 0 360;
                 loop: true;
                 dur: 3000;
                 easing: linear">
    </a-plane>

    <!-- AR Studio text -->
    <a-text
      value="AR STUDIO"
      position="0 -0.24 0.08"
      align="center"
      color="#302B50"
      width="1.6"
      scale="1 1 1"
      material="shader: flat">
    </a-text>

    <!-- Animated sphere -->
    <a-sphere
      position="0 0.12 0.15"
      radius="0.10"
      material="color: #8B72D4;
                shader: flat"
      animation="property: position;
                 from: 0 0.12 0.15;
                 to: 0 0.32 0.15;
                 dir: alternate;
                 loop: true;
                 dur: 1200">
    </a-sphere>

  </a-entity>

</a-scene>

<script>
const target = document.getElementById("target");
const status = document.getElementById("status");

target.addEventListener("targetFound", () => {
  status.textContent =
    "✨ Image detected — AR animation should be visible!";
});

target.addEventListener("targetLost", () => {
  status.textContent =
    "Move your camera toward the sample image.";
});
</script>

</body>
</html>
