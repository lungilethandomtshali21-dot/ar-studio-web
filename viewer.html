
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Studio | Live AR Camera</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
:root {
  --lilac: #DCCBFF;
  --purple: #8B72D4;
  --deep: #51447D;
  --blue: #DCEFFF;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #10101B;
  font-family: Arial, sans-serif;
}

/* Full-screen AR scene */
a-scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  margin: 0 !important;
}

/* Keep the camera and rendering canvas full-screen */
video,
canvas {
  max-width: none;
}

/* Header */
.header {
  position: fixed;
  z-index: 1000;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  background: rgba(255,255,255,0.94);
  border: 1px solid var(--lilac);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  color: var(--deep);
  font-size: 19px;
  font-weight: 800;
}

.back {
  text-decoration: none;
  background: var(--purple);
  color: white;
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 13px;
}

/* Camera status */
.status {
  position: fixed;
  z-index: 1000;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 5%;
  width: 90%;
  padding: 15px;
  background: rgba(240,232,255,0.95);
  border-radius: 14px;
  color: var(--deep);
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  pointer-events: none;
}

/* Restart button */
.restart {
  position: fixed;
  z-index: 1001;
  bottom: calc(105px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  border: 0;
  background: var(--purple);
  color: white;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.restart:active {
  background: var(--deep);
}
</style>
</head>

<body>

<!-- Navigation -->
<div class="header">
  <div class="logo">✦ AR Studio</div>
  <a href="dashboard.html" class="back">
    Dashboard
  </a>
</div>

<!-- Status -->
<div id="status" class="status">
  Starting AR camera...
</div>

<!-- Restart -->
<button class="restart" id="restartBtn">
  ↻ Restart Camera
</button>

<!-- Augmented Reality Scene -->
<a-scene
  id="arScene"
  mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
  embedded
  renderer="colorManagement: true; alpha: true; antialias: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- Camera -->
  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- Tracked Image -->
  <a-entity
    id="imageTarget"
    mindar-image-target="targetIndex: 0">

    <!-- Lilac background -->
    <a-plane
      position="0 0 0.01"
      width="0.95"
      height="0.55"
      material="color: #DCCBFF;
                opacity: 0.85;
                transparent: true;
                shader: flat;
                side: double">
    </a-plane>

    <!-- Rotating 3D box -->
    <a-box
      position="0 0.10 0.25"
      width="0.35"
      height="0.35"
      depth="0.35"
      material="color: #8B72D4;
                shader: flat"
      animation="property: rotation;
                 from: 0 0 0;
                 to: 0 360 360;
                 loop: true;
                 dur: 4000;
                 easing: linear">
    </a-box>

    <!-- Floating sphere -->
    <a-sphere
      position="0.32 0.15 0.12"
      radius="0.10"
      material="color: #DCEFFF;
                shader: flat"
      animation="property: position;
                 from: 0.32 0.15 0.12;
                 to: 0.32 0.35 0.12;
                 dir: alternate;
                 loop: true;
                 dur: 1400">
    </a-sphere>

    <!-- AR Studio text -->
    <a-text
      value="AR STUDIO"
      position="0 -0.19 0.07"
      align="center"
      color="#302B50"
      width="1.6"
      material="shader: flat">
    </a-text>

  </a-entity>
</a-scene>

<script>
const scene = document.getElementById("arScene");
const target = document.getElementById("imageTarget");
const statusBox = document.getElementById("status");
const restartBtn = document.getElementById("restartBtn");

function setStatus(message) {
  statusBox.textContent = message;
}

// AR system is ready
scene.addEventListener("loaded", () => {
  setStatus(
    "Allow camera access, then point at the sample image."
  );
});

// Tracking started
target.addEventListener("targetFound", () => {
  setStatus(
    "✨ Image detected! Look for the purple AR animation."
  );
});

// Tracking lost
target.addEventListener("targetLost", () => {
  setStatus(
    "Move your camera back toward the sample image."
  );
});

// Camera error
scene.addEventListener("arError", () => {
  setStatus(
    "Camera could not start. Check permissions and try again."
  );
});

// Restart the AR camera
restartBtn.addEventListener("click", async () => {
  setStatus("Restarting camera...");
  restartBtn.disabled = true;

  try {
    const arSystem = scene.systems["mindar-image-system"];

    if (!arSystem) {
      throw new Error("AR system unavailable");
    }

    await arSystem.stop();
    await arSystem.start();

    setStatus(
      "Camera restarted. Point at the sample image."
    );
  } catch (error) {
    console.error(error);
    setStatus(
      "Restart failed. Refresh the page and try again."
    );
  } finally {
    restartBtn.disabled = false;
  }
});
</script>

</body>
</html>
